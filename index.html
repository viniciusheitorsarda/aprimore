<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#f3f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#172b29" media="(prefers-color-scheme: dark)">
  <title>Contexto sobre extrusão · Aprimore Alumínio</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="extrusao.js" defer></script>
  <script src="contexto.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand" aria-label="Aprimore Alumínio"><img src="assets/logo.png" alt=""><span>aprimore<small>ALUMÍNIO</small></span></div>
      <span id="counter" aria-label="Etapa do treinamento"></span>
    </header>
    <progress id="progress" value="1" max="17" aria-label="Progresso do treinamento"></progress>
    <main id="lesson" tabindex="-1">
      <h1 id="title">O que é extrusão de alumínio?</h1>
      <section class="visual" aria-label="Conteúdo visual da etapa">
        <div id="slide-content"></div>
        <svg id="scene" hidden viewBox="0 0 660 410" role="img" aria-labelledby="scene-title scene-desc">
          <title id="scene-title">Ferramenta de extrusão</title><desc id="scene-desc">Uma matriz de aço com abertura em formato de degraus.</desc>
          <defs>
            <linearGradient id="die-face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#607887"/><stop offset="1" stop-color="#2d4656"/></linearGradient>
            <path id="section-shape"/>
          </defs>
          <g id="composition"><g id="machine"></g></g>
        </svg>
      </section>
    </main>
    <nav class="controls" aria-label="Navegação do treinamento"><button id="back" class="back" disabled>Voltar</button><button id="next" class="next">Avançar</button></nav>
  </div>
  <noscript>Ative o JavaScript para controlar as etapas da extrusão.</noscript>
</body>
</html>
